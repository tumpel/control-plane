name: update-dashboard

on:
  repository_dispatch:
    types: [component-released]

concurrency:
  group: update-dashboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-dashboard:
    if: github.event.client_payload.component == 'dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: update-dashboard
        name: Update dashboard dependencies and enable auto-merge
        env:
          CONTROL_PLANE_UPDATE_TOKEN: ${{ secrets.CONTROL_PLANE_UPDATE_TOKEN }}
        run: npm run release:update-dashboard
